name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the job only reads the repository (SEC-13). Actions are pinned by commit SHA.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Firebase emulators (spec 12.4 F-25): rules and Admin SDK adapters, then the signed-in E2E.
      # The Firestore emulator needs Java 21.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.17.0
      - run: npm run test:emulator
      # Reuses the production build from test:e2e (same environment-independent build).
      - run: npm run test:e2e:emulators
        env:
          E2E_SKIP_BUILD: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            playwright-report-emulators
